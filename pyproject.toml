[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voxtream2-ru-jetson"
version = "0.1.0"
description = "PyTorch-free TensorRT runtime for VoXtream2-RU on NVIDIA Jetson"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "x0rium"}]
dependencies = [
  "numpy<2",
  "ru-normalizr==0.3.0",
  "ruaccent==1.5.8.3",
]

[project.optional-dependencies]
dev = ["ruff==0.15.17"]

[project.scripts]
voxtream2-ru-jetson = "voxtream2_ru_jetson.runtime:main"
voxtream2-ru-jetson-resident = "voxtream2_ru_jetson.resident:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Stable baseline for both the reusable runtime and archived research probes.
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E501", "EXE001"]
